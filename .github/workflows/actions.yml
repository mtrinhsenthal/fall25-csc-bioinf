name: Github CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          export PATH=${PATH}:${HOME}/.codon/bin
      - name: Check out repository code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Codon Python bridge
        run: |
          pip install find_libpython
          export CODON_PYTHON=$(find_libpython)
          echo "Found Python at: ${CODON_PYTHON}"
      # - name: Install jupyter
      #   run: |
      #     conda install jupyter notebook
      # - name: Week 6
      #   run: |
      #     export CODON_PYTHON=/opt/hostedtoolcache/Python/3.13.7/x64/lib/libpython3.13.so.1.0
      #     conda create -n af -y -c bioconda simpleaf
      #     conda activate af
      #     conda install -c scanpy celltypist anndata python-igraph leidenalg celltypist
      #     jupyter nbconvert --to notebook --execute week6/week6.ipynb
      - name: Install Week 6 pip tools
        run: |
          pip install --no-deps pyroe
          pip install leidenalg celltypist "numpy==1.23.5" "pandas==1.5.3" "scanpy==1.9.8" "anndata==0.9.2" "pyranges==0.0.120" "biopython>=1.77"
      - name: Install Week 6 Conda tools
        shell: bash -l {0}
        run: |
          conda config --add channels conda-forge
          conda install -c bioconda salmon alevin-fry
      - name: Install jupyter
        run: pip install jupyter notebook
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: week6
        run: jupyter nbconvert --to notebook --execute week6/week6.ipynb
